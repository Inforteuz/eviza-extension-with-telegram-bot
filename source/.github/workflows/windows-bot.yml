name: Windows bot checks
on:
  workflow_dispatch:
  push:
    paths: ['agent/**', 'lib/**', 'test/**', 'windows/**', 'scripts/test-agent.mjs', '.github/workflows/windows-bot.yml']
  pull_request:
    paths: ['agent/**', 'lib/**', 'test/**', 'windows/**', 'scripts/test-agent.mjs', '.github/workflows/windows-bot.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: agent
      - run: python -m pip install -r agent/requirements.txt
      - run: node scripts/test-agent.mjs
      - name: Check Windows runtime
        shell: pwsh
        run: |
          $env:PYTHON_BIN = (Get-Command python.exe).Source
          node agent/platform-check.mjs
      - name: Parse installer with Windows PowerShell
        shell: powershell
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
